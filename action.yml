name: pols checkout
description: Checks out a repository from a Git mirror kept on the pols runner cache, fetching only new commits; elsewhere, actions/checkout.
author: pols.so
branding:
  icon: git-branch
  color: gray-dark

# The inputs and outputs of actions/checkout, with its defaults. On a pols
# runner with a cache, ssh-key, filter, sparse-checkout, lfs and submodules
# hand the checkout to actions/checkout.
inputs:
  repository:
    description: Repository name with owner. For example, actions/checkout
    required: false
    default: ${{ github.repository }}
  ref:
    description: The branch, tag or SHA to checkout. Defaults to the reference or SHA for the event that triggered the workflow.
    required: false
  token:
    description: Token used to fetch the repository
    required: false
    default: ${{ github.token }}
  ssh-key:
    description: SSH key used to fetch the repository (checked out by actions/checkout)
    required: false
  ssh-known-hosts:
    description: Known hosts in addition to the user and global host key database
    required: false
  ssh-strict:
    description: Whether to perform strict host key checking
    required: false
    default: "true"
  ssh-user:
    description: The user to use when connecting to the remote SSH host
    required: false
    default: git
  persist-credentials:
    description: Whether to configure the token with the local git config
    required: false
    default: "true"
  path:
    description: Relative path under $GITHUB_WORKSPACE to place the repository
    required: false
  clean:
    description: Whether to execute `git clean -ffdx && git reset --hard HEAD` before fetching
    required: false
    default: "true"
  filter:
    description: Partially clone against a given filter (checked out by actions/checkout)
    required: false
  sparse-checkout:
    description: Do a sparse checkout on given patterns (checked out by actions/checkout)
    required: false
  sparse-checkout-cone-mode:
    description: Specifies whether to use cone-mode when doing a sparse checkout
    required: false
    default: "true"
  fetch-depth:
    description: Number of commits to fetch. 0 indicates all history for all branches and tags. The cache's mirror always has all history.
    required: false
    default: "1"
  fetch-tags:
    description: Whether to fetch tags, even if fetch-depth > 0
    required: false
    default: "false"
  show-progress:
    description: Whether to show progress status output when fetching
    required: false
    default: "true"
  lfs:
    description: Whether to download Git-LFS files (checked out by actions/checkout)
    required: false
    default: "false"
  submodules:
    description: Whether to checkout submodules, true or recursive (checked out by actions/checkout)
    required: false
    default: "false"
  set-safe-directory:
    description: Add repository path as safe.directory for Git global config
    required: false
    default: "true"
  github-server-url:
    description: The base URL for the GitHub instance that you are trying to clone from
    required: false
  allow-unsafe-pr-checkout:
    description: Passed to actions/checkout
    required: false
    default: "false"
  cache-wait:
    description: Seconds to wait for pols to say whether the job has a cache
    required: false
    default: "60"

outputs:
  ref:
    description: The branch, tag or SHA that was checked out
    value: ${{ steps.pols.outputs.ref || steps.upstream.outputs.ref }}
  commit:
    description: The commit SHA that was checked out
    value: ${{ steps.pols.outputs.commit || steps.upstream.outputs.commit }}
  cached:
    description: Whether the checkout came from the pols runner cache (true or false)
    value: ${{ steps.pols.outcome == 'success' }}

runs:
  using: composite
  steps:
    - id: cache
      shell: bash
      env:
        POLS_CACHE_WAIT: ${{ inputs.cache-wait }}
      run: bash "$GITHUB_ACTION_PATH/scripts/cache-status.sh"

    - id: pols
      if: >-
        steps.cache.outputs.mode == 'cached' && inputs.ssh-key == '' && inputs.filter == '' &&
        inputs.sparse-checkout == '' && inputs.lfs != 'true' && inputs.submodules == 'false'
      # A cached checkout that fails hands over to actions/checkout.
      continue-on-error: true
      shell: bash
      env:
        CACHE: ${{ steps.cache.outputs.path }}
        REPOSITORY: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        TOKEN: ${{ inputs.token }}
        CHECKOUT_PATH: ${{ inputs.path }}
        CLEAN: ${{ inputs.clean }}
        FETCH_DEPTH: ${{ inputs.fetch-depth }}
        FETCH_TAGS: ${{ inputs.fetch-tags }}
        PERSIST_CREDENTIALS: ${{ inputs.persist-credentials }}
        SHOW_PROGRESS: ${{ inputs.show-progress }}
        SET_SAFE_DIRECTORY: ${{ inputs.set-safe-directory }}
        SERVER_URL: ${{ inputs.github-server-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/checkout.sh"

    - id: upstream
      if: steps.pols.outcome != 'success'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        ssh-key: ${{ inputs.ssh-key }}
        ssh-known-hosts: ${{ inputs.ssh-known-hosts }}
        ssh-strict: ${{ inputs.ssh-strict }}
        ssh-user: ${{ inputs.ssh-user }}
        persist-credentials: ${{ inputs.persist-credentials }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        filter: ${{ inputs.filter }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        show-progress: ${{ inputs.show-progress }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}
        set-safe-directory: ${{ inputs.set-safe-directory }}
        github-server-url: ${{ inputs.github-server-url }}
        allow-unsafe-pr-checkout: ${{ inputs.allow-unsafe-pr-checkout }}
